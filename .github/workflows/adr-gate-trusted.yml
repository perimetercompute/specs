# The append-only gate as a required workflow, the half of the history-aware
# layer (SPEC §8.1) that nothing inside a change can forge. An organization
# ruleset requires THIS file as it stands on the default branch, so a pull
# request cannot rewrite it, and it runs the default branch's
# tools/adr-gate.sh against the pull request's tree, never the pull request's
# copy of either. It holds no secret, its token is read-only, and it reads
# the pull request's files only as data. adr-gate.yml still runs on push and
# posts the awaiting-ratification comment, which needs a write token.
name: adr-gate-trusted

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: adr-gate-trusted-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  adr-gate-trusted:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "the gate script, from the default branch"
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git show "origin/$DEFAULT_BRANCH:tools/adr-gate.sh" > "$RUNNER_TEMP/adr-gate.sh"

      - name: "layer 1: every record matches its hash and its schema"
        run: bash "$RUNNER_TEMP/adr-gate.sh"

      - name: "layer 2: no merged record or manifest entry is modified, renamed or deleted; a spec change rides a new record"
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          base="$(git merge-base "origin/$DEFAULT_BRANCH" HEAD)"
          # MDRT, not MDR: replacing a record with a symlink is a type change.
          bad="$(git diff --name-status --diff-filter=MDRT "$base" HEAD -- \
            ':(glob,icase)**/docs/adr/**' \
            ':(exclude)docs/adr/README.md' \
            ':(exclude,glob)docs/adr/adr-manifest/**' \
            ':(exclude,icase)third_party/**')"
          if [ -n "$bad" ]; then
            echo "::error::ADRs are append-only. Restore these files; a change of mind is a NEW record with 'supersedes: <id>'."
            echo "$bad"; exit 1
          fi
          adr_files="$(git ls-files -- ':(glob,icase)**/docs/adr/**' \
            ':(exclude)docs/adr/README.md' ':(exclude,glob)docs/adr/adr-manifest/**' \
            ':(exclude,icase)third_party/**')"
          uncovered=""
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            entry="docs/adr/adr-manifest/$(basename "$f" .md).txt"
            [ -f "$entry" ] && awk -v p="$f" '$2 == p {found=1} END {exit !found}' "$entry" || uncovered="${uncovered}${f}"$'\n'
          done <<<"$adr_files"
          if [ -n "$uncovered" ]; then
            echo "::error::every file under a docs/adr/ dir must be a record registered in the central manifest (docs/adr/README.md rules 3 and 6)"
            printf '%s' "$uncovered"; exit 1
          fi
          bad_manifest="$(git diff --name-status --diff-filter=MDRT "$base" HEAD -- 'docs/adr/adr-manifest')"
          if [ -n "$bad_manifest" ]; then
            echo "::error::adr-manifest/ entries may only be added (docs/adr/README.md rule 6):"
            echo "$bad_manifest"; exit 1
          fi
          spec_changes="$(git diff --name-only "$base" HEAD -- ':(glob)*/SPEC.md')"
          if [ -n "$spec_changes" ]; then
            new_records="$(git diff --name-only --diff-filter=A "$base" HEAD -- ':(glob)docs/adr/2*.md')"
            if [ -z "$new_records" ]; then
              echo "::error::a change to a spec rides a NEW record in docs/adr/ that says why (README, Changing a spec):"
              echo "$spec_changes"; exit 1
            fi
          fi

      - name: "layer 3: no 'status: proposed' record reaches the default branch"
        env:
          ADR_GATE_GIT_MODE: "1"
        run: bash "$RUNNER_TEMP/adr-gate.sh"
